<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anmelden · PlanetCare Field</title>
  <meta name="theme-color" content="#1F5A3A" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/overview.css" />
  <link rel="stylesheet" href="styles/measures.css" />
  <style>
    .login { max-width: 420px; margin: 10vh auto 0; padding: 0 var(--s4); }
    .login-card { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s6); }
    .login h1 { font-size: var(--fs-title); margin: var(--s4) 0 var(--s2); }
    .login p { color: var(--text-muted); margin: 0 0 var(--s5); }
    .login .btn-primary { width: 100%; margin-top: var(--s4); }
    .login-msg { margin-top: var(--s4); font-size: var(--fs-small); }
    .login-msg.ok { color: var(--good); } .login-msg.err { color: var(--critical); }
    .login-alt { text-align: center; margin-top: var(--s6); font-size: var(--fs-small); }
  </style>
</head>
<body>
  <main class="login">
    <a class="brand" href="/demo"><img class="brand-mark" src="icons/logo-mark.svg" alt="" width="28" height="28" />PlanetCare Field</a>
    <div class="login-card" style="margin-top: var(--s5)">
      <h1>Anmelden</h1>
      <p>Geben Sie Ihre E Mail Adresse ein. Wir schicken Ihnen einen Link, mit dem Sie sich ohne Passwort anmelden.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E Mail Adresse</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
        </div>
        <button class="btn-primary" type="submit">Anmeldelink senden</button>
        <p class="login-msg" id="login-msg" role="status"></p>
      </form>
    </div>
    <p class="login-alt"><a href="/demo">Demo ohne Anmeldung ansehen</a></p>
  </main>
  <script>
    const msg = document.getElementById("login-msg");
    const q = new URLSearchParams(location.search);
    if (q.get("fehler") === "link") { msg.className = "login-msg err"; msg.textContent = "Der Link ist abgelaufen oder wurde schon verwendet. Bitte einen neuen anfordern."; }
    if (q.has("abgemeldet")) { msg.className = "login-msg ok"; msg.textContent = "Sie wurden abgemeldet."; }
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) { msg.className = "login-msg err"; msg.textContent = "Bitte eine gültige E Mail Adresse eingeben."; return; }
      const btn = e.target.querySelector("button"); btn.disabled = true;
      try {
        await fetch("/api/auth/request-link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
        msg.className = "login-msg ok";
        msg.textContent = "Wenn die Adresse freigeschaltet ist, kommt in wenigen Minuten eine E Mail. Bitte auch im Spam Ordner nachsehen.";
      } catch (err) {
        msg.className = "login-msg err"; msg.textContent = "Gerade nicht erreichbar. Bitte später erneut versuchen.";
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
