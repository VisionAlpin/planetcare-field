<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F5A3A" />
  <title>Übersicht · PlanetCare Field</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/overview.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <span class="brand">PlanetCare Field</span>
      <span class="badge">Demo</span>
      <div class="header-right">
        <span class="farm-name" data-farm-name></span>
        <button class="icon-button" type="button" aria-label="Menü öffnen">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Hauptnavigation">
    <div class="container">
      <a class="tab" href="#uebersicht" aria-current="page"><span data-icon="layout-dashboard"></span>Übersicht</a>
      <a class="tab" href="#felder"><span data-icon="map"></span>Felder</a>
      <a class="tab" href="#markt"><span data-icon="bar-chart"></span>Markt</a>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1 data-field-name></h1>
          <p class="page-meta" data-field-meta></p>
        </div>
        <label>
          <span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Schlag und Saison wählen</span>
          <select class="select" data-field-select></select>
        </label>
      </div>

      <section class="kpis" data-kpis aria-label="Kennzahlen"></section>

      <div class="hint" data-hint role="status"></div>

      <div class="lower">
        <section class="panel" data-chart>
          <div class="panel-head">
            <h2 data-chart-title></h2>
            <span class="muted">Skala 0 bis 100</span>
          </div>
          <div class="legend"></div>
          <div class="chart-wrap"></div>
          <button class="table-toggle" type="button" aria-expanded="false">Als Tabelle anzeigen</button>
          <table class="data-table" hidden></table>
        </section>

        <section class="panel panel--map">
          <div class="panel-head">
            <h2 data-map-name></h2>
          </div>
          <div class="map-box" data-map></div>
          <div class="map-foot">
            <span class="num" data-map-area></span>
            <a href="#felder">Zur Karte</a>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="container" data-footer></div>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/overview.js"></script>
  <script>
    // Tab Symbole einsetzen
    document.querySelectorAll("[data-icon]").forEach((el) => { el.outerHTML = icon(el.dataset.icon); });

    async function load(fieldId, season) {
      const res = await fetch(
        `/api/fields/${encodeURIComponent(fieldId)}/overview?season=${season}`,
        { credentials: "same-origin" }
      );
      if (res.status === 401) { location.href = "/login"; return; }
      if (!res.ok) throw new Error("Overview " + res.status);
      PlanetCareField.renderOverview(await res.json());
    }

    const params = new URLSearchParams(location.search);
    load(
      params.get("field") || "default",
      params.get("season") || new Date().getFullYear()
    ).catch(() => {
      document.querySelector("main .container").innerHTML =
        "<p>Die Daten konnten gerade nicht geladen werden. Bitte später erneut versuchen.</p>";
    });

    document.querySelector("[data-field-select]").addEventListener("change", (e) => {
      const [field, season] = e.target.value.split(":");
      location.search = `?field=${field}&season=${season}`;
    });
  </script>
</body>
</html>
